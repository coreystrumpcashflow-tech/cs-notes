      const remember = document.getElementById("r").checked;
      const bits = await derive(document.getElementById("p").value);
      await show(bits);
      if (remember) { try { localStorage.setItem(STORE, bu(bits)); } catch (_) {} }
    } catch (err) { msg.textContent = "Wrong PIN."; }
  });
})();
