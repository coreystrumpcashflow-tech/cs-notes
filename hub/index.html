  addEventListener("hashchange", () => { link = location.hash.slice(1); const m = document.getElementById("msg"); if (m) m.textContent = ""; });
  const msg = document.getElementById("msg");
  async function show(bits) {
    const k = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(D.iv) }, k, ub(D.ct));
    const html = new TextDecoder().decode(pt);
    if (document.readyState !== "complete") await new Promise(r => addEventListener("load", r, { once: true }));
    await new Promise(r => setTimeout(r, 0));
    document.open(); document.write(html); document.close();
    for (const id of ["f", "lockcss"]) { const el = document.getElementById(id); if (el) el.remove(); }
  }
  async function derive(pin) {
    const e = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", e.encode(link + ":" + pin), "PBKDF2", false, ["deriveBits"]);
    return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: e.encode(D.salt), iterations: D.iter }, base, 256);
  }
  (async () => {
    let saved = null;
    try { saved = localStorage.getItem(STORE); } catch (e) {}
    if (saved) {
      try { await show(ub(saved)); return; } catch (e) { try { localStorage.removeItem(STORE); } catch (_) {} }
    }
    if (!link) msg.textContent = "Open this from your saved link.";
  })();
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    if (!link) { msg.textContent = "Open this from your saved link."; return; }
    msg.textContent = "";
    try {
      const remember = document.getElementById("r").checked;
      const bits = await derive(document.getElementById("p").value);
      await show(bits);
      if (remember) { try { localStorage.setItem(STORE, bu(bits)); } catch (_) {} }
    } catch (err) { msg.textContent = "Wrong PIN."; }
  });
})();
</script></body></html>
